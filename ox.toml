[app]
health = "/_zoo/health"

[storage]
keep = ["data", "uploads"]

# SeaweedFS in one process (master, volume, filer, S3). The S3 credentials
# file is written at start so the password stays off the command line. The
# master, volume and filer ports are pinned outside ox's 9010-9999 range
# (their gRPC ports are each +10000), and the S3 Iceberg and Lance listeners,
# on by default (8181, 9101), are switched off.
[services.s3]
run      = "umask 077; printf '{\"identities\":[{\"name\":\"ox\",\"credentials\":[{\"accessKey\":\"ox\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$SERVICE_PASSWORD\" > \"$SERVICE_DATA_DIR/s3.json\"; mkdir -p \"$SERVICE_DATA_DIR/weed\"; exec weed -logtostderr server -ip=127.0.0.1 -ip.bind=127.0.0.1 -dir=\"$SERVICE_DATA_DIR/weed\" -master.port=18333 -volume.port=18080 -filer.port=18888 -master.volumeSizeLimitMB=256 -volume.max=8 -s3 -s3.port=\"$PORT\" -s3.config=\"$SERVICE_DATA_DIR/s3.json\" -s3.port.iceberg=0 -s3.port.lance=0"
tool     = "github:seaweedfs/seaweedfs@4.48"
health   = "/healthz"
memory   = "256M"
provides = { S3_ENDPOINT = "http://${host}:${port}", S3_ACCESS_KEY = "ox", S3_SECRET_KEY = "${password}" }
